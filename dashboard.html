function _pctRet(prices) {
  if (!prices || prices.length < 2 || prices[0] === 0) return null;
  return (prices[prices.length - 1] - prices[0]) / prices[0] * 100;
}
function _annualVol(prices) {
  if (!prices || prices.length < 3) return null;
  const rets = [];
  for (let i = 1; i < prices.length; i++) {
    if (prices[i - 1] > 0) rets.push((prices[i] - prices[i - 1]) / prices[i - 1]);
  }
  if (rets.length < 2) return null;
  const mu = rets.reduce((a, b) => a + b, 0) / rets.length;
  const v  = rets.reduce((a, r) => a + (r - mu) ** 2, 0) / (rets.length - 1);
  return Math.sqrt(v * 252) * 100;
}
function _maxDD(prices) {
  if (!prices || prices.length < 2) return null;
  let peak = prices[0], mdd = 0;
  for (const p of prices) {
    if (p > peak) peak = p;
    const dd = (p - peak) / peak * 100;
    if (dd < mdd) mdd = dd;
  }
  return mdd;
}

// Approximate dates by spreading n points evenly across the timeframe's calendar
// span (series are sampled, not one-point-per-weekday — walking back weekdays was
// badly wrong for 2Y/5Y).
const _TF_SPAN_DAYS = { '1W': 7, '1M': 30, '3M': 91, '6M': 182, '2Y': 730, '5Y': 1826 };
function _estimateDates(n, tf) {
  const now  = new Date();
  let   span = _TF_SPAN_DAYS[tf];
  if (!span) span = Math.max(1, Math.round((now - new Date(now.getFullYear(), 0, 1)) / 86400000)); // YTD
  const fmt = span > 365
    ? { month: 'short', day: 'numeric', year: '2-digit' }
    : { month: 'short', day: 'numeric' };
  const dates = [];
  for (let i = 0; i < n; i++) {
    const back = n > 1 ? span * (1 - i / (n - 1)) : 0;
    dates.push(new Date(now.getTime() - back * 86400000).toLocaleDateString('en-US', fmt));
  }
  return dates;
}

function _attachChartTooltip(wrap, prices, W, map, tf) {
  function el(cls, html) {
    let e = wrap.querySelector('.' + cls);
    if (!e) {
      e = document.createElement('div');
      e.className = cls;
      if (html) e.innerHTML = html;
      wrap.appendChild(e);
    }
    return e;
  }
  const tip   = el('an-tip');
  const hair  = el('an-hair');
  const hhair = el('an-hair-h');
  const tagY  = el('an-tag-y');
  const tagX  = el('an-tag-x');
  // Targeting reticle: corner brackets around a center pip
  const snap  = el('an-snap',
    '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">' +
    '<path d="M1 6V1H6M14 1H19V6M19 14V19H14M6 19H1V14" fill="none" stroke="#e6e1dc" stroke-width="1.3"/>' +
    '<circle cx="10" cy="10" r="2" fill="#e6e1dc"/></svg>');
  const parts = [tip, hair, hhair, tagY, tagX, snap];

  const n     = prices.length;
  const dates = _estimateDates(n, tf);
  const open  = prices[0];

  wrap._anMove && wrap.removeEventListener('mousemove', wrap._anMove);
  wrap._anLeave && wrap.removeEventListener('mouseleave', wrap._anLeave);

  wrap._anMove = function(e) {
    const rect = wrap.getBoundingClientRect();
    const x    = e.clientX - rect.left;
    const span = map.xp(n - 1) || 1;
    const idx  = Math.max(0, Math.min(n - 1, Math.round((x / span) * (n - 1))));
    const px   = map.xp(idx);
    const py   = map.yp(prices[idx]);
    const chg  = open ? (prices[idx] - open) / open * 100 : null;
    tip.innerHTML = `<span class="an-tip-k">Δ OPEN</span> ` +
      (chg == null ? '—' : `<span style="color:${chg >= 0 ? 'var(--tan)' : 'var(--neg)'}">${(chg >= 0 ? '+' : '') + chg.toFixed(2)}%</span>`) +
      `<span class="an-tip-k"> · PT ${String(idx + 1).padStart(3, '0')}/${n}</span>`;
    const tipW     = tip.offsetWidth || 150;
    tip.style.left = (px + 16 + tipW > W - 70 ? px - tipW - 16 : px + 16) + 'px';
    tip.style.top  = Math.max(4, Math.min(py - 34, wrap.clientHeight - 30)) + 'px';
    tagY.textContent = '$' + (prices[idx] || 0).toFixed(2);
    tagY.style.top   = py + 'px';
    tagX.textContent = dates[idx] || '';
    const tagW       = tagX.offsetWidth || 60;
    tagX.style.left  = Math.max(tagW / 2, Math.min(W - tagW / 2, px)) + 'px';
    hair.style.left  = px + 'px';
    hhair.style.top  = py + 'px';
    snap.style.left  = px + 'px';
    snap.style.top   = py + 'px';
    parts.forEach(p => p.classList.add('on'));
  };
  wrap._anLeave = function() {
    parts.forEach(p => p.classList.remove('on'));
  };
  wrap.addEventListener('mousemove', wrap._anMove);
  wrap.addEventListener('mouseleave', wrap._anLeave);
}

function _drawAnalysisChart(prices, animate) {
  requestAnimationFrame(() => {
    const wrap = document.getElementById('an-chart-wrap');
    const c    = document.getElementById('an-chart');
    if (!wrap || !c) return;
    const W   = wrap.clientWidth || 800;
    const map = drawSparkline(c, prices, W, wrap.clientHeight || 140, { grid: true, animate });
    if (map) {
      _attachChartTooltip(wrap, prices, W, map, activeAnalysisTF);
    } else if (wrap._anMove) {
      wrap.removeEventListener('mousemove', wrap._anMove);
      wrap.removeEventListener('mouseleave', wrap._anLeave);
      wrap._anMove = wrap._anLeave = null;
    }
  });
}

function renderAnalysisPanel(w) {
  const h        = w.history || {};
  const TFS      = ['1W', '1M', '3M', '6M', 'YTD', '2Y', '5Y'];
  const longHist = [h['5Y'], h['2Y'], h.YTD, h['6M']].find(s => s && s.length > 5) || [];

  const METRICS = [
    { label: '1W',  val: _pctRet(h['1W']  || []) },
    { label: '1M',  val: _pctRet(h['1M']  || []) },
    { label: '3M',  val: _pctRet(h['3M']  || []) },
    { label: '6M',  val: _pctRet(h['6M']  || []) },
    { label: 'YTD', val: _pctRet(h.YTD    || []) },
    { label: '2Y',  val: _pctRet(h['2Y']  || []) },
    { label: '5Y',  val: _pctRet(h['5Y']  || []) },
    { label: 'VOL', val: _annualVol(longHist), isVol: true },
    { label: 'MDD', val: _maxDD(longHist),     isMdd: true },
  ];

  function metricHTML(m) {
    let text, cls;
    if (m.val === null || m.val === undefined || isNaN(m.val)) {
      text = '—'; cls = 'an-m-neu';
    } else if (m.isVol) {
      text = m.val.toFixed(1) + '%'; cls = 'an-m-neu';
    } else if (m.isMdd) {
      text = m.val.toFixed(1) + '%'; cls = m.val < -5 ? 'an-m-neg' : 'an-m-neu';
    } else {
      text = (m.val >= 0 ? '+' : '') + m.val.toFixed(2) + '%';
      cls  = m.val > 0.001 ? 'an-m-pos' : m.val < -0.001 ? 'an-m-neg' : 'an-m-neu';
    }
    return `<div class="an-metric"><span class="an-m-label">${m.label}</span><span class="an-m-val ${cls}">${text}</span></div>`;
  }

  const a = w.analysis || {};
  const claudeRows = [
    { k: 'Thesis', v: a.thesis, cls: 'an-c-thesis' },
    { k: 'Bull',   v: a.bull,   cls: 'an-c-bull' },
    { k: 'Bear',   v: a.bear,   cls: 'an-c-bear' },
    { k: 'Watch',  v: a.watch,  cls: 'an-c-watch' },
  ].filter(r => r.v && r.v.trim());
  const claudeHTML = claudeRows.length ? `
    <div class="an-claude">
      <div class="an-claude-head">
        <span class="an-claude-title">Deep Analysis</span>
        <span class="an-claude-tag">Powered by Claude</span>
      </div>
      ${claudeRows.map(r => `
        <div class="an-claude-row ${r.cls}">
          <span class="an-claude-label">${r.k}</span>
          <p class="an-claude-text">${escapeHTML(r.v)}</p>
        </div>`).join('')}
    </div>` : '';

  document.getElementById('analysis-hint').textContent = '';
  document.getElementById('analysis-content').innerHTML = `
    <div class="an-header">
      <span class="an-ticker">${escapeHTML(w.ticker)}</span>
      <span class="an-label">${escapeHTML(w.label)}</span>
      ${w.sector ? `<span class="an-sector">${escapeHTML(w.sector)}</span>` : ''}
      <div class="an-tf-bar">${TFS.map(t => `<button class="wl-tf${t === activeAnalysisTF ? ' active' : ''}" data-an-tf="${t}">${t}</button>`).join('')}</div>
    </div>
    <div id="an-chart-wrap"><canvas id="an-chart"></canvas></div>
    <div class="an-metrics">${METRICS.map(metricHTML).join('')}</div>
    ${claudeHTML}
    ${w.description ? `<p class="an-desc">${escapeHTML(w.description)}</p>` : ''}
  `;
  _drawAnalysisChart((h[activeAnalysisTF] || h.YTD || h['6M'] || []));
}

function clearAnalysisPanel() {
  activeAnalysisTicker = null;
  document.getElementById('analysis-hint').textContent = '';
  document.getElementById('analysis-content').innerHTML =
    '<div class="an-empty">Click a company in the watchlist to view analysis.</div>';
}

(function init() {
  renderHeader();


  // Defer 3D init by one frame so layout dimensions are committed
  let holdingMeshes = [], savingsMeshes = [];
  requestAnimationFrame(() => {
    const holdings = D.holdings || [];
    const hColors  = holdings.map((h, i) => localStorage.getItem('color_h_' + h.ticker) || SLICE_COLORS[i % SLICE_COLORS.length]);
    holdingMeshes  = build3DRing(
      'chart-portfolio',
      holdings.length ? holdings.map(h => h.ticker) : ['—'],
      holdings.length ? holdings.map(h => h.value)  : [1],
      T.portfolio_value || 0,
      hColors,
    ) || [];

    const savings  = D.savings || [];
    const sColors  = savings.map((s, i) => localStorage.getItem('color_s_' + s.name) || SLICE_COLORS[i % SLICE_COLORS.length]);
    savingsMeshes  = build3DRing(
      'chart-savings',
      savings.length ? savings.map(s => s.name)    : ['—'],
      savings.length ? savings.map(s => s.balance) : [1],
      T.savings_total || 0,
      sColors,
    ) || [];
  });

  renderProgressBar('prog-portfolio', T.portfolio_value || 0, T.portfolio_goal || null, 'portfolio');
  renderProgressBar('prog-savings',   T.savings_total   || 0, T.savings_goal   || null, 'savings');

  document.querySelector('.wl-tf-bar')?.addEventListener('click', e => {
    const btn = e.target.closest('.wl-tf');
    if (!btn) return;
    document.querySelectorAll('.wl-tf').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTF = btn.dataset.tf;
    drawAllSparklines();
  });

  renderHoldings();
  drawHoldingSparklines(true);
  renderSavings();
  renderWatchlist();

  // Re-fit every 2D canvas on window resize (the 3D rings handle their own)
  let canvasResizeT;
  window.addEventListener('resize', () => {
    clearTimeout(canvasResizeT);
    canvasResizeT = setTimeout(() => {
      drawAllSparklines(false);
      drawHoldingSparklines(false);
      const w = (D.watchlist || []).find(x => x.ticker === activeAnalysisTicker);
      if (w) _drawAnalysisChart((w.history || {})[activeAnalysisTF] || [], false);
    }, 150);
  });

  ['holdings', 'savings'].forEach(type => {
    const btn  = document.getElementById(`${type}-legend-btn`);
    const list = document.getElementById(`${type}-list`);
    btn?.addEventListener('click', () => {
      const open = list.classList.toggle('legend-open');
      btn.classList.toggle('active', open);
    });
  });

  ['holdings-list', 'savings-list'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      const sw = e.target.closest('.color-swatch');
      if (!sw) return;
      const row = sw.closest('[data-key]');
      if (!row) return;
      const key   = row.dataset.key;
      const color = sw.dataset.color;
      localStorage.setItem('color_' + key, color);
      row.querySelector('.dr-left').style.color = color;
      row.querySelectorAll('.color-swatch').forEach(s =>
        s.classList.toggle('active', s.dataset.color === color)
      );
      // Update the corresponding 3D ring slice
      if (key.startsWith('h_')) {
        const ticker = key.slice(2);
        const idx = (D.holdings || []).findIndex(h => h.ticker === ticker);
        if (idx >= 0 && holdingMeshes[idx]) applySliceColor(holdingMeshes[idx], color);
      } else if (key.startsWith('s_')) {
        const name = key.slice(2);
        const idx = (D.savings || []).findIndex(s => s.name === name);
        if (idx >= 0 && savingsMeshes[idx]) applySliceColor(savingsMeshes[idx], color);
      }
    });
  });
  clearAnalysisPanel();

  document.getElementById('watchlist-rows').addEventListener('click', e => {
    const nameEl = e.target.closest('.wl-name');
    if (!nameEl) return;
    const ticker = nameEl.closest('.wl-row')?.dataset.ticker;
    const w      = ticker && (D.watchlist || []).find(x => x.ticker === ticker);
    if (!w) return;
    document.querySelectorAll('.wl-name').forEach(n => n.classList.remove('active-analysis'));
    if (activeAnalysisTicker === ticker) { clearAnalysisPanel(); return; }
    nameEl.classList.add('active-analysis');
    activeAnalysisTicker = ticker;
    renderAnalysisPanel(w);
    document.getElementById('analysis-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('analysis-panel').addEventListener('click', e => {
    const btn = e.target.closest('[data-an-tf]');
    if (!btn) return;
    const w = (D.watchlist || []).find(x => x.ticker === activeAnalysisTicker);
    if (!w) return;
    activeAnalysisTF = btn.dataset.anTf;
    document.querySelectorAll('[data-an-tf]').forEach(b =>
      b.classList.toggle('active', b.dataset.anTf === activeAnalysisTF)
    );
    _drawAnalysisChart((w.history || {})[activeAnalysisTF] || []);
  });

  const wlTip     = document.getElementById('wl-tooltip');
  const ttSector  = document.getElementById('tt-sector');
  const ttDesc    = document.getElementById('tt-desc');
  let   wlTipTimer = null;

  document.getElementById('watchlist-rows').addEventListener('mouseover', e => {
    const nameEl = e.target.closest('.wl-name');
    if (!nameEl) return;
    const desc   = nameEl.dataset.description || '';
    const sector = nameEl.dataset.sector      || '';
    if (!desc && !sector) return;
    ttSector.textContent = sector;
    ttSector.style.display = sector ? 'block' : 'none';
    ttDesc.textContent   = desc;
    clearTimeout(wlTipTimer);
    wlTip.style.display  = 'block';
    wlTip.style.opacity  = '1';
  });

  document.getElementById('watchlist-rows').addEventListener('mousemove', e => {
    if (!e.target.closest('.wl-name')) return;
    const x = e.clientX + 16;
    const y = e.clientY + 10;
    wlTip.style.left = (x + wlTip.offsetWidth > window.innerWidth ? e.clientX - wlTip.offsetWidth - 8 : x) + 'px';
    wlTip.style.top  = (y + wlTip.offsetHeight > window.innerHeight ? e.clientY - wlTip.offsetHeight - 8 : y) + 'px';
  });

  document.getElementById('watchlist-rows').addEventListener('mouseout', e => {
    if (!e.target.closest('.wl-name')) return;
    wlTip.style.opacity = '0';
    wlTipTimer = setTimeout(() => { wlTip.style.display = 'none'; }, 150);
  });
})();
</script>
</body>
</html>
