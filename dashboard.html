<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vero</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #0a0a0a;
  --border: #282828;
  --text:   #d8d0c8;
  --dim:    #928c84;
  --cream:  #e6e1dc;
  --tan:    #d8d0c8;
  --gold:   #8b4a3a;
  --orange: #a03828;
  --neg:    #b65548;
  --oxide:  #4C0701;
  --font-mono: 'Courier New', Courier, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
  --font:   var(--font-mono);              /* legacy alias */
}

html, body {
  width: 100%; min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Numeric / tabular data keeps the monospace identity */
.mono, .panel-value, .wl-price, .dr-left, .dr-right, .dr-sub,
.hm-val, .hm-pos, .hm-neg, .an-ticker, .an-m-val,
.progress-meta .pct, .progress-foot, #header-gain, #header-time,
#header-staleness, #header-title, #header-brand {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

body::before {
  content: ''; position: fixed; inset: 0;
  pointer-events: none; z-index: 1;
  background:
    linear-gradient(rgba(200,190,180,0.006) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,190,180,0.006) 1px, transparent 1px);
  background-size: 48px 48px;
}

body::after {
  content: ''; position: fixed; inset: 0;
  pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(
    0deg, transparent 0, transparent 4px,
    rgba(0,0,0,0.035) 4px, rgba(0,0,0,0.035) 5px
  );
}

#header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 20px;
  padding: 13px 28px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 20px rgba(160,56,40,0.06);
  font-size: 14px;
}

@keyframes akira-glitch {
  0%, 92%, 100% { transform: translateX(0); text-shadow: none; clip-path: none; }
  93%  { transform: translateX(-1.5px);
         clip-path: polygon(0 15%, 100% 15%, 100% 38%, 0 38%);
         text-shadow: 1.5px 0 var(--gold); }
  94%  { transform: translateX(1.5px);
         clip-path: polygon(0 55%, 100% 55%, 100% 78%, 0 78%);
         text-shadow: -1.5px 0 var(--orange); }
  95%  { transform: translateX(0); clip-path: none; text-shadow: none; }
}

#header-title {
  font-size: 20px; font-weight: bold;
  letter-spacing: 0.20em; color: var(--tan);
  pointer-events: none;
  animation: akira-glitch 14s ease-in-out infinite;
}

#header-gain {
  margin-left: auto;
  font-size: 14px; letter-spacing: 0.08em;
  transition: opacity 60ms;
}

#header-status {
  display: flex; align-items: center; gap: 7px;
  font-size: 13px; letter-spacing: 0.12em; color: var(--dim);
}

#status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim);
}
#status-dot.live {
  background: var(--tan);
  animation: dot-pulse 2.4s ease-in-out infinite;
}
@keyframes dot-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}

#header-time {
  font-size: 13px; color: var(--dim);
  letter-spacing: 0.06em; margin-left: 14px;
}
#header-viz {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 72px; height: 40px;
  border: 1px solid var(--border); border-radius: 2px;
  opacity: 0.9; pointer-events: none;
}
#header-brand-stack {
  display: flex; flex-direction: column; gap: 2px; line-height: 1.05;
}
#header-brand {
  font-size: 17.5px; letter-spacing: 0.14em; color: var(--tan);
}
#header-staleness {
  font-size: 13px; letter-spacing: 0.06em;
  transition: color 0.4s;
}
#header-staleness.stale { color: var(--gold); }
#header-staleness.old   { color: var(--orange); }

#main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
  min-height: calc(100vh - 50px);
}

.panel {
  background: var(--bg);
  padding: 32px 32px 40px;
  display: flex; flex-direction: column; gap: 28px;
  box-shadow: inset 0 0 28px rgba(160,56,40,0.03);
}
.panel--full { grid-column: 1 / -1; }

.panel-header {
  display: flex; justify-content: flex-start; align-items: center; gap: 14px;
  padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.panel-label {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; letter-spacing: 0.24em;
  color: var(--text); text-transform: uppercase;
}
.panel-label::before {
  content: ''; width: 3px; height: 13px;
  background: var(--orange); border-radius: 1px;
  box-shadow: 0 0 8px rgba(160,56,40,0.6);
}
.panel-value {
  font-size: 32px; color: var(--tan);
  letter-spacing: 0.04em; font-weight: bold;
}
.panel-value--cyan {
  color: #585145;
  text-shadow: 0 0 18px rgba(88,81,69,0.65), 0 0 40px rgba(88,81,69,0.2);
}

.chart-container {
  position: relative;
  width: 100%; max-width: 300px;
  min-height: 280px;
  margin: 0 auto;
  aspect-ratio: 1 / 1;
}
.chart-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none; text-align: center;
}

.progress-wrap { display: flex; flex-direction: column; gap: 7px; }

.progress-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 13px; letter-spacing: 0.08em;
}
.progress-meta .lbl { color: var(--dim); }
.progress-meta .pct { color: var(--tan); }

.progress-track {
  width: 100%; height: 10px;
  background: var(--border);
  border: 1px solid #1c1c1c;
  border-radius: 5px; overflow: hidden;
  position: relative;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.65);
}
/* 25/50/75% landmark hairlines, kept above the fill */
.progress-track::before {
  content: ''; position: absolute; inset: 0;
  pointer-events: none; z-index: 2;
  background:
    linear-gradient(90deg, transparent calc(25% - 1px), rgba(216,208,200,0.12) calc(25% - 1px), rgba(216,208,200,0.12) 25%, transparent 25%),
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(216,208,200,0.12) calc(50% - 1px), rgba(216,208,200,0.12) 50%, transparent 50%),
    linear-gradient(90deg, transparent calc(75% - 1px), rgba(216,208,200,0.12) calc(75% - 1px), rgba(216,208,200,0.12) 75%, transparent 75%);
}
.progress-fill {
  height: 100%; width: 0; border-radius: 5px;
  background: linear-gradient(90deg,
    #d8d0c8  0%,
    #787878 45%,
    var(--oxide) 100%
  );
  box-shadow: 0 0 10px 1px rgba(160, 56, 40, 0.55),
              0 0 4px  1px rgba(200, 190, 180, 0.3),
              inset 0 1px 0 rgba(255,255,255,0.28);
  position: relative;
  overflow: hidden;
  animation: fill-bar 1.6s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
/* Glowing endpoint cap — the "current position" marker */
.progress-fill.has-cap::before {
  content: '';
  position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cream);
  box-shadow: 0 0 8px 2px rgba(216,208,200,0.7);
}
.progress-fill::after {
  content: '';
  position: absolute; top: 0; bottom: 0; left: -55%; width: 55%;
  background: linear-gradient(90deg,
    transparent 0%, rgba(255,255,255,0.30) 50%, transparent 100%
  );
  animation: akira-shimmer 2.4s 2.3s ease-in-out infinite;
}
@keyframes fill-bar { to { width: var(--pct, 0%); } }
@keyframes akira-shimmer {
  0%   { left: -55%; opacity: 0.7; }
  60%  { opacity: 1; }
  100% { left: 120%; opacity: 0.7; }
}

.progress-foot {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--dim); letter-spacing: 0.06em;
}

.goal-hint {
  font-size: 12px; color: var(--dim);
  letter-spacing: 0.04em; line-height: 1.6; padding: 2px 0;
}

.table-label {
  font-size: 12px; letter-spacing: 0.22em;
  color: var(--dim); text-transform: uppercase;
}
.table-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.legend-btn {
  background: none; border: 1px solid var(--border); color: var(--dim);
  font-family: var(--font); font-size: 11px; letter-spacing: 0.14em;
  padding: 2px 8px; cursor: pointer; border-radius: 2px;
  transition: color 0.15s, border-color 0.15s;
}
.legend-btn:hover { color: var(--tan); border-color: var(--tan); }
.legend-btn.active { color: var(--orange); border-color: var(--orange); }

.data-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 14px; gap: 8px;
}
.data-row:last-child { border-bottom: none; }

.dr-left  { color: var(--tan); min-width: 72px; letter-spacing: 0.06em; font-size: 14px; }
.dr-mid   { color: var(--dim); flex: 1; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dr-right { text-align: right; min-width: 80px; font-size: 14px; color: var(--tan); }
.dr-sub   { display: block; font-size: 12px; color: var(--dim); margin-top: 1px; }
.dr-sub.pos { color: var(--tan); }
.dr-sub.neg { color: var(--neg); }

.color-picker {
  display: flex; gap: 3px; align-items: center; flex-shrink: 0;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.legend-open .color-picker { opacity: 1; pointer-events: auto; }
.color-swatch {
  width: 10px; height: 10px; border-radius: 50%; border: none;
  cursor: pointer; padding: 0; background: transparent;
  outline: 1px solid transparent; outline-offset: 1px;
  transition: transform 0.1s, outline-color 0.1s;
}
.color-swatch:hover { transform: scale(1.5); }
.color-swatch.active { outline-color: rgba(255,255,255,0.55); }

.holding-metrics {
  display: flex; gap: 18px; flex-wrap: wrap;
  padding: 2px 0 10px 0; border-bottom: 1px solid var(--border);
  font-size: 12px; letter-spacing: 0.04em;
}
.holding-metrics:last-child { border-bottom: none; }
.hm-seg   { display: flex; align-items: baseline; gap: 5px; }
.hm-label { font-size: 11px; color: var(--dim); letter-spacing: 0.10em; text-transform: uppercase; }
.hm-val   { color: var(--tan); }
.hm-pos   { color: var(--tan); }
.hm-neg   { color: var(--neg); }

/* Cost→gain proportion mini bar */
.hm-bar {
  display: inline-flex; gap: 1px;
  width: 70px; height: 6px; border-radius: 3px; overflow: hidden;
  background: rgba(40,40,40,0.8); align-self: center;
}
.hm-bar-cost { background: #4a4640;    height: 100%; }
.hm-bar-gain { background: var(--tan); height: 100%; }
.hm-bar-loss { background: var(--neg); height: 100%; }

.wl-tf-bar { display: flex; gap: 5px; align-items: center; margin-left: auto; }
.wl-tf {
  background: none; border: 1px solid var(--border); color: var(--dim);
  font-family: var(--font); font-size: 12px; letter-spacing: 0.12em;
  padding: 3px 9px; cursor: pointer; border-radius: 2px;
  transition: color 0.15s, border-color 0.15s;
}
.wl-tf:hover  { color: var(--tan);    border-color: var(--tan); }
.wl-tf.active {
  color: var(--cream); border-color: var(--orange);
  background: rgba(160,56,40,0.16);
}
.wl-tf:focus-visible, .legend-btn:focus-visible {
  outline: 1px solid var(--orange); outline-offset: 2px;
}

.wl-row {
  display: grid;
  grid-template-columns: minmax(140px, 1.6fr) 120px minmax(150px, 1fr) 220px;
  align-items: center; gap: 24px; padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.wl-row:last-child { border-bottom: none; }

.wl-name  { font-size: 14px; color: var(--tan); letter-spacing: 0.01em; }
.wl-tick  { font-family: var(--font-mono); font-size: 11px; color: var(--dim); letter-spacing: 0.12em; margin-top: 4px; }
.wl-price { font-size: 16px; color: var(--tan); letter-spacing: 0.02em; font-weight: bold; }

.wl-signal         { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
.wl-signal.BULLISH { color: #5fbf8f; }
.wl-signal.BEARISH { color: #c2503f; }
.wl-signal.NEUTRAL { color: #98908a; }
.wl-reason  { font-size: 12px; color: var(--dim); letter-spacing: 0.01em; margin-top: 4px; line-height: 1.5; }
.wl-sparkline  { display: block; width: 220px; height: 48px; }
.hm-sparkline  { display: block; margin-left: auto; opacity: 0.82; }

#analysis-content img {
  width: 100%; display: block;
  border-radius: 2px; opacity: 0.92;
}
.wl-empty { font-size: 13px; color: var(--dim); letter-spacing: 0.10em; padding: 28px 0; text-align: center; }

#wl-tooltip {
  position: fixed;
  pointer-events: none;
  background: #120d10;
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 12px;
  letter-spacing: 0.04em;
  padding: 10px 14px;
  border-radius: 2px;
  opacity: 0;
  transition: opacity 0.15s;
  box-shadow: 0 0 14px rgba(160,56,40,0.18);
  z-index: 500;
  max-width: 320px;
  line-height: 1.55;
  display: none;
}
#wl-tooltip .tt-sector {
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 6px;
}
#wl-tooltip .tt-desc { color: var(--dim); letter-spacing: 0.01em; line-height: 1.6; }
.wl-name { cursor: pointer; }
.wl-name.active-analysis { color: var(--oxide); }

.an-empty  { font-size: 13px; color: var(--dim); letter-spacing: 0.10em; padding: 28px 0; text-align: center; }
.an-header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.an-ticker { font-size: 22px; color: var(--tan); letter-spacing: 0.12em; font-weight: bold; }
.an-label  { font-size: 14px; color: var(--text); letter-spacing: 0.01em; }
.an-sector { font-size: 11px; color: var(--gold); letter-spacing: 0.16em; text-transform: uppercase; margin-left: auto; }
.an-tf-bar { display: flex; gap: 5px; }
#an-chart-wrap { position: relative; width: 100%; height: 140px; margin-bottom: 28px; }
#an-chart      { display: block; }
.an-metrics { display: flex; flex-wrap: wrap; border: 1px solid var(--border); margin-bottom: 2px; }
.an-metric  { flex: 1; min-width: 80px; padding: 13px 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
.an-metric:last-child { border-right: none; }
.an-m-label { font-size: 11px; color: var(--dim); letter-spacing: 0.16em; text-transform: uppercase; }
.an-m-val   { font-size: 15px; letter-spacing: 0.04em; }
.an-m-pos   { color: var(--tan); }
.an-m-neg   { color: var(--neg); }
.an-m-neu   { color: var(--dim); }
.an-desc    { font-size: 13px; color: var(--dim); letter-spacing: 0.01em; line-height: 1.7; border-top: 1px solid var(--border); padding-top: 20px; margin-top: 22px; max-width: 78ch; }

/* ── HUD layer: analysis crosshair ─────────────────────────────── */
.an-tip, .an-hair, .an-hair-h, .an-snap, .an-tag-y, .an-tag-x {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.12s;
}
.an-tip.on, .an-hair.on, .an-hair-h.on, .an-snap.on, .an-tag-y.on, .an-tag-x.on { opacity: 1; }
.an-tip {
  z-index: 20; white-space: nowrap;
  background: rgba(18,13,16,0.9); border: 1px solid #3a3330; border-left: 2px solid var(--orange);
  color: var(--text); font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-size: 11px; letter-spacing: 0.08em; padding: 5px 10px;
  box-shadow: 0 0 12px rgba(160,56,40,0.22);
}
.an-tip-k { color: var(--dim); font-size: 10px; letter-spacing: 0.14em; }
.an-hair {
  top: 0; bottom: 0; width: 1px; z-index: 19;
  background: linear-gradient(180deg, transparent, rgba(216,208,200,0.45) 18%, rgba(216,208,200,0.45) 82%, transparent);
  box-shadow: 0 0 6px rgba(216,208,200,0.25);
}
.an-hair-h {
  left: 0; right: 0; height: 1px; z-index: 19;
  background: repeating-linear-gradient(90deg, rgba(216,208,200,0.32) 0 4px, transparent 4px 8px);
}
.an-snap {
  width: 20px; height: 20px; z-index: 21;
  transform: translate(-50%, -50%) scale(1.7) rotate(45deg);
  transition: opacity 0.12s, transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.3);
  filter: drop-shadow(0 0 4px rgba(216,208,200,0.6));
}
.an-snap svg { display: block; }
.an-snap.on { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
.an-tag-y, .an-tag-x {
  z-index: 22; white-space: nowrap;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-size: 10px; letter-spacing: 0.06em; padding: 1px 6px;
  background: #170c0a;
}
.an-tag-y {
  right: 0; transform: translateY(-50%);
  border: 1px solid var(--orange); color: var(--cream);
  box-shadow: 0 0 8px rgba(160,56,40,0.4);
}
.an-tag-x {
  top: calc(100% + 4px); transform: translateX(-50%);
  border: 1px solid #3a3330; color: var(--text);
}

/* ── HUD layer: ring callout ───────────────────────────────────── */
.ring-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.ring-callout {
  position: absolute; pointer-events: none; z-index: 10; opacity: 0;
  padding: 6px 11px; white-space: nowrap;
  background: rgba(18,13,16,0.86);
  border: 1px solid #3a3330; border-left: 2px solid var(--orange);
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  box-shadow: 0 0 16px rgba(160,56,40,0.25);
}
.rc-name { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
.rc-val  { font-size: 15px; color: var(--cream); letter-spacing: 0.04em; margin-top: 2px;
           text-shadow: 0 0 8px rgba(230,225,220,0.35); }
.rc-pct  { font-size: 10px; color: var(--text); letter-spacing: 0.12em; margin-top: 2px; }
.rc-pct span { color: var(--dim); }

/* ── HUD layer: panel brackets + one-time boot scan ────────────── */
.panel { position: relative; }
.panel::before {
  content: ''; position: absolute; inset: 7px; pointer-events: none;
  --bc: rgba(160,56,40,0.5); --bl: 12px;
  background:
    linear-gradient(var(--bc), var(--bc)) top left     / var(--bl) 1px no-repeat,
    linear-gradient(var(--bc), var(--bc)) top left     / 1px var(--bl) no-repeat,
    linear-gradient(var(--bc), var(--bc)) top right    / var(--bl) 1px no-repeat,
    linear-gradient(var(--bc), var(--bc)) top right    / 1px var(--bl) no-repeat,
    linear-gradient(var(--bc), var(--bc)) bottom left  / var(--bl) 1px no-repeat,
    linear-gradient(var(--bc), var(--bc)) bottom left  / 1px var(--bl) no-repeat,
    linear-gradient(var(--bc), var(--bc)) bottom right / var(--bl) 1px no-repeat,
    linear-gradient(var(--bc), var(--bc)) bottom right / 1px var(--bl) no-repeat;
}
@media (prefers-reduced-motion: no-preference) {
  .panel::after {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    pointer-events: none; opacity: 0; z-index: 3;
    background: linear-gradient(90deg, transparent, rgba(208,86,60,0.75) 50%, transparent);
    box-shadow: 0 0 14px 2px rgba(160,56,40,0.35);
    animation: panel-scan 1.5s 0.1s cubic-bezier(0.45, 0, 0.2, 1) forwards;
  }
  .panel:nth-child(2)::after { animation-delay: 0.25s; }
  .panel:nth-child(3)::after { animation-delay: 0.4s; }
  .panel:nth-child(4)::after { animation-delay: 0.55s; }
}
@keyframes panel-scan {
  0%   { top: 0;    opacity: 0; }
  10%  { opacity: 1; }
  85%  { opacity: 0.7; }
  100% { top: 100%; opacity: 0; }
}

.an-claude       { margin-top: 26px; border-top: 1px solid var(--border); padding-top: 20px; }
.an-claude-head  { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
.an-claude-title { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--tan); }
.an-claude-tag   { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.an-claude-tag::before { content: '◆ '; color: var(--gold); }
.an-claude-row   { display: grid; grid-template-columns: 60px 1fr; gap: 16px; align-items: start;
                   border-left: 2px solid var(--border); padding: 4px 0 4px 16px; margin-bottom: 14px; }
.an-claude-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); padding-top: 2px; }

<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"
        crossorigin="anonymous"></script>

<script>
// __DASH_DATA_PLACEHOLDER__
</script>

<script>
'use strict';

const D       = window.__DASH__ || { savings: [], holdings: [], watchlist: [], totals: {} };
const T       = D.totals || {};
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const SLICE_COLORS = [
  '#d8d0c8', '#a03828', '#8b4a3a', '#6e2020',
  '#324155', '#3c2d46', '#0f2d23',
  '#660000', '#4a3220', '#ff69b4', '#39d353', '#454545',
];
const OXIDE = '#4C0701';

function fmt$(v) {
  return '$' + (+v || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function fmtPct(v) {
  return (v >= 0 ? '+' : '') + (+v || 0).toFixed(2) + '%';
}
function fmtPrice(v) {
  return '$' + (+v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtSigned$(v) {
  const n = +v || 0;
  return (n >= 0 ? '+$' : '-$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
/* Signed dollars for P&L figures: cents only under $1,000 to avoid digit soup */
function fmtGain$(v) {
  const n = +v || 0;
  const digits = Math.abs(n) >= 1000 ? 0 : 2;
  return (n >= 0 ? '+$' : '-$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

/* Shared canvas primitives (used by the header viz and sparkline end-dots) */
function cvDot(ctx, x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function cvRing(ctx, x, y, r, s)   { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.strokeStyle = s; ctx.lineWidth = 1; ctx.stroke(); }
function cvGlow(ctx, x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

function escapeHTML(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function typeWriter(el, text, msPer, cb) {
  if (REDUCED) { el.textContent = text; cb && cb(); return; }
  let i = 0;
  const id = setInterval(() => {
    el.textContent += text[i++];
    if (i >= text.length) { clearInterval(id); cb && cb(); }
  }, msPer);
}

/* Procedural equirect environment map shared by both rings — gives the metallic
   materials something to reflect. Near-black studio with a bone key light, an
   oxide glow low-right, and a faint steel-blue fill (r131+ auto-PMREMs this). */
let _envTex = null;
function ringEnvTexture() {
  if (_envTex) return _envTex;
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#050505';
  x.fillRect(0, 0, 256, 128);
  [
    [64, 28, 85, '216,208,200', 0.55],
    [204, 96, 95, '76,7,1', 0.85],
    [150, 18, 60, '50,65,85', 0.35],
  ].forEach(([cx, cy, r, rgb, a]) => {
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `rgba(${rgb},${a})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    x.fillStyle = g;
    x.fillRect(0, 0, 256, 128);
  });
  _envTex = new THREE.CanvasTexture(c);
  _envTex.mapping = THREE.EquirectangularReflectionMapping;
  return _envTex;
}

/* Soft radial-gradient texture shared by the particle system and the core halo sprite */
let _glowTex = null;
function glowTexture() {
  if (_glowTex) return _glowTex;
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.45)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 64, 64);
  _glowTex = new THREE.CanvasTexture(c);
  return _glowTex;
}

/* Sets a slice's color + luminance-boosted emissive (min luminance 0.30, boost
   capped at 4× to preserve hue identity). Used at build time and by the live
   swatch recolor so dark palette picks keep their glow. */
function applySliceColor(mesh, hex) {
  const color    = new THREE.Color(hex);
  const emissive = color.clone();
  const lum = 0.2126 * emissive.r + 0.7152 * emissive.g + 0.0722 * emissive.b;
  // Dark picks stay dark: damp their emissive and env reflections so the 1.3
  // intensity + sheen don't wash them pastel; a faint floor keeps only
  // near-black picks hover-visible. Both branches set envMapIntensity so
  // recoloring dark -> light restores the full reflection.
  if (lum < 0.30) {
    emissive.multiplyScalar(0.35);
    if (lum < 0.10) emissive.multiplyScalar(Math.min(0.10 / Math.max(lum, 0.001), 2));
    mesh.material.envMapIntensity = 0.18;
  } else {
    mesh.material.envMapIntensity = 0.35;
  }
  mesh.material.color.copy(color);
  mesh.material.emissive.copy(emissive);
  mesh.userData.hexColor = hex;
}

/* HUD primitives: additive vertex-colored geometry, so "black" reads as transparent */
// Guarded: the CDN script may have failed, and build3DRing() handles that itself
const HUD_BONE   = window.THREE ? new THREE.Color('#e6e1dc') : null;
const HUD_ORANGE = window.THREE ? new THREE.Color('#a03828') : null;
const HUD_EMBER  = window.THREE ? new THREE.Color('#d0563c') : null;

function hudMat(opts = {}) {
  return new THREE.LineBasicMaterial(Object.assign({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }, opts));
}

// Radial tick scale, vertices ordered by angle so setDrawRange() sweeps it in
function hudDegreeScale(r, minorLen, majorLen, count, majorEvery) {
  const pos = [], col = [];
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    const major = i % majorEvery === 0;
    const r1 = r + (major ? majorLen : minorLen);
    const k  = major ? 0.55 : 0.22;
    pos.push(Math.cos(a) * r, Math.sin(a) * r, 0, Math.cos(a) * r1, Math.sin(a) * r1, 0);
    col.push(HUD_BONE.r * k, HUD_BONE.g * k, HUD_BONE.b * k, HUD_BONE.r * k, HUD_BONE.g * k, HUD_BONE.b * k);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
  return new THREE.LineSegments(g, hudMat({ vertexColors: true }));
}

// Thin flat arc band
function hudArc(rIn, rOut, start, len, color, opacity) {
  return new THREE.Mesh(
    new THREE.RingGeometry(rIn, rOut, Math.max(8, Math.round(len * 40)), 1, start, len),
    new THREE.MeshBasicMaterial({
      color, transparent: true, opacity, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }),
  );
}

// Radar sweep: a wedge whose vertex colors fade to black along its trailing edge
function hudSweep(rIn, rOut, tail, steps) {
  const pos = [], col = [], idx = [];
  for (let k = 0; k <= steps; k++) {
    const a = -(k / steps) * tail;
    const f = Math.pow(1 - k / steps, 2.2) * 0.55;
    pos.push(Math.cos(a) * rIn, Math.sin(a) * rIn, 0, Math.cos(a) * rOut, Math.sin(a) * rOut, 0);
    col.push(HUD_ORANGE.r * f * 0.6, HUD_ORANGE.g * f * 0.6, HUD_ORANGE.b * f * 0.6,
             HUD_EMBER.r * f, HUD_EMBER.g * f, HUD_EMBER.b * f);
    if (k < steps) {
      const v = k * 2;
      idx.push(v, v + 1, v + 2, v + 1, v + 3, v + 2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  const wedge = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  // Bright leading edge
  const edgeG = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(rIn, 0, 0), new THREE.Vector3(rOut, 0, 0),
  ]);
  const edge = new THREE.Line(edgeG, hudMat({ color: HUD_BONE, opacity: 0.55 }));
  const grp = new THREE.Group();
  grp.add(wedge, edge);
  return grp;
}

const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeOutBack  = p => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const clamp01      = v => v < 0 ? 0 : v > 1 ? 1 : v;

function build3DRing(containerId, labels, values, totalValue, colors) {
  const container = document.getElementById(containerId);
  if (!container) return;

  if (!window.THREE) {
    container.innerHTML = '<p style="color:var(--dim);font-size:13px;text-align:center;padding-top:40%">3D unavailable</p>';
    return;
  }

  container.style.position = 'relative';
  container.innerHTML = '';

  let W = container.clientWidth  || 280;
  let H = container.clientHeight || W;

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
  // Pulled back from the old (0,1.6,4.6) so the HUD shell outside the bezel fits
  const CAM_BASE = new THREE.Vector3(0, 1.75, 5.35);
  camera.position.copy(CAM_BASE);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping         = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  container.appendChild(renderer.domElement);

  // 2D overlay for the hover leader line
  const overlay = document.createElement('canvas');
  overlay.className = 'ring-overlay';
  container.appendChild(overlay);
  const octx = overlay.getContext('2d');
  function sizeOverlay() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    overlay.width = W * dpr; overlay.height = H * dpr;
    overlay.style.width = W + 'px'; overlay.style.height = H + 'px';
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeOverlay();

  scene.environment = ringEnvTexture();

  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      W = container.clientWidth || 280;
      H = container.clientHeight || W;
      renderer.setSize(W, H);
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      sizeOverlay();
    }, 150);
  });

  // Ring A — Holdings allocation (outermost)
  const A_OUT = 1.56, A_IN = 1.20, A_DEPTH = 0.20, GAP = 0.11;
  const MID_R = (A_OUT + A_IN) / 2;
  const total  = values.reduce((a, b) => a + b, 0) || 1;
  const groupA = new THREE.Group();
  const meshesA = [];
  let ang0 = 0;

  values.forEach((val, i) => {
    if (val <= 0) return;
    const rawAng   = (val / total) * Math.PI * 2;
    const sliceAng = Math.max(rawAng - GAP, 0.01);
    const hexColor = (colors && colors[i]) || SLICE_COLORS[i % SLICE_COLORS.length];

    const shape = new THREE.Shape();
    shape.absarc(0, 0, A_OUT, ang0, ang0 + sliceAng, false);
    shape.absarc(0, 0, A_IN,  ang0 + sliceAng, ang0, true);
    shape.closePath();

    // Bevelled rims catch the env map as bright machined-metal edge highlights
    const geo  = new THREE.ExtrudeGeometry(shape, {
      depth: A_DEPTH, curveSegments: 64,
      bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.015, bevelSegments: 2,
    });
    // Low metalness/envMapIntensity so slice hue identity survives the reflections
    const mat  = new THREE.MeshStandardMaterial({
      emissiveIntensity: 1.3,
      metalness: 0.35, roughness: 0.2, envMapIntensity: 0.35,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData = {
      label: labels[i] || '—', value: val, hexColor,
      midAngle: ang0 + sliceAng / 2, startAngle: ang0, endAngle: ang0 + sliceAng,
      bootStart: ang0 / (Math.PI * 2),
    };
    applySliceColor(mesh, hexColor);

    // Wireframe edge outline, lit on hover
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo, 30),
      hudMat({ color: HUD_BONE, opacity: 0 }),
    );
    mesh.add(edges);
    mesh.userData.edges = edges;

    groupA.add(mesh);
    meshesA.push(mesh);
    ang0 += rawAng;
  });

  groupA.position.z = -A_DEPTH / 2;
  scene.add(groupA);

  // Ring D — Outer precision bezel
  const bezGeo = new THREE.TorusGeometry(1.72, 0.024, 16, 120);
  const bezMat = new THREE.MeshStandardMaterial({
    color: 0x3a3a3a, emissive: 0x1a1a1a, emissiveIntensity: 0.4,
    metalness: 0.95, roughness: 0.12, transparent: true, opacity: 1,
  });
  const bezel = new THREE.Mesh(bezGeo, bezMat);
  scene.add(bezel);

  // Inner-edge trim torus
  const trimGeo = new THREE.TorusGeometry(1.29, 0.016, 16, 120);
  const trimMat = new THREE.MeshStandardMaterial({
    color: 0x2a2a2a, emissive: new THREE.Color(OXIDE), emissiveIntensity: 0.25,
    metalness: 0.95, roughness: 0.1,
  });
  scene.add(new THREE.Mesh(trimGeo, trimMat));

  // Ring B — Precision tick ring (middle, counter-rotates)
  const B_OUT = 1.10, B_IN = 0.95, B_DEPTH = 0.12;
  const groupB  = new THREE.Group();
  const N_TICKS = 48;
  const tickAng = (Math.PI * 2) / N_TICKS;

  for (let i = 0; i < N_TICKS; i++) {
    const isMajor = i % 6 === 0;
    const a0    = i * tickAng;
    const gap   = isMajor ? 0.018 : 0.038;
    const shape = new THREE.Shape();
    shape.absarc(0, 0, B_OUT, a0, a0 + tickAng - gap, false);
    shape.absarc(0, 0, B_IN,  a0 + tickAng - gap, a0, true);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: B_DEPTH, bevelEnabled: false });
    const mat = new THREE.MeshStandardMaterial({
      color:    isMajor ? 0x787878 : 0x5C5C5C,
      emissive: isMajor ? 0x4a4a4a : 0x2e2e2e,
      emissiveIntensity: isMajor ? 0.75 : 0.5,
      metalness: 0.9, roughness: 0.2,
    });
    const tick = new THREE.Mesh(geo, mat);
    tick.position.z = -B_DEPTH / 2;
    groupB.add(tick);
  }
  scene.add(groupB);

  // Ring C — Inner chamber (fast rotation)
  const C_OUT = 0.55, C_IN = 0.35, C_DEPTH = 0.14;
  const groupC   = new THREE.Group();
  const N_INNER  = 12;
  const innerAng = (Math.PI * 2) / N_INNER;

  for (let i = 0; i < N_INNER; i++) {
    const a0    = i * innerAng;
    const shape = new THREE.Shape();
    shape.absarc(0, 0, C_OUT, a0, a0 + innerAng - 0.04, false);
    shape.absarc(0, 0, C_IN,  a0 + innerAng - 0.04, a0, true);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: C_DEPTH, bevelEnabled: false, curveSegments: 32 });
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(OXIDE), emissive: new THREE.Color(OXIDE), emissiveIntensity: 0.7,
      metalness: 0.6, roughness: 0.2,
    });
    const seg = new THREE.Mesh(geo, mat);
    seg.position.z = -C_DEPTH / 2;
    groupC.add(seg);
  }
  scene.add(groupC);

  const coreGroup = new THREE.Group();
  scene.add(coreGroup);

  const coreInnerMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 32, 32),
    new THREE.MeshStandardMaterial({
      color: 0xd8d0c8, emissive: 0xd8d0c8, emissiveIntensity: 2.0,
      metalness: 0.0, roughness: 0.0,
    })
  );
  coreGroup.add(coreInnerMesh);

  const coreMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(OXIDE), emissive: new THREE.Color(OXIDE), emissiveIntensity: 1.0,
    metalness: 0.0, roughness: 0.0, transparent: true, opacity: 0.8,
  });
  const coreMesh = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), coreMat);
  coreGroup.add(coreMesh);

  // Arc-reactor gyroscope: thin tilted orbit rings around the core
  const gyros = [0.30, 0.27, 0.245].map((r, i) => {
    const t = new THREE.Mesh(
      new THREE.TorusGeometry(r, 0.0045, 6, 96),
      new THREE.MeshBasicMaterial({
        color: i === 1 ? HUD_BONE : HUD_EMBER, transparent: true, opacity: i === 1 ? 0.35 : 0.6,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }),
    );
    t.rotation.set(0.9 + i * 0.7, i * 1.1, 0);
    coreGroup.add(t);
    return t;
  });

  // Camera-facing halo sprite — reads as light bloom without postprocessing
  const coreHaloMat = new THREE.SpriteMaterial({
    map: glowTexture(), color: 0xa03828,
    transparent: true, opacity: 0.30,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const coreHalo = new THREE.Sprite(coreHaloMat);
  coreHalo.scale.set(1.2, 1.2, 1);
  coreHalo.renderOrder = 2;
  scene.add(coreHalo);

  // ── Holographic HUD shell ─────────────────────────────────────────────
  const hud = new THREE.Group();
  scene.add(hud);

  // Faint backplate: concentric range rings + radial spokes behind the rings
  const plate = new THREE.Group();
  plate.position.z = -0.35;
  [0.72, 1.85].forEach(r => {
    const pts = [];
    for (let i = 0; i <= 128; i++) { const a = i / 128 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0)); }
    plate.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), hudMat({ color: HUD_BONE, opacity: 0.07 })));
  });
  const spokes = [];
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    spokes.push(new THREE.Vector3(Math.cos(a) * 0.62, Math.sin(a) * 0.62, 0), new THREE.Vector3(Math.cos(a) * 1.85, Math.sin(a) * 1.85, 0));
  }
  plate.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(spokes), hudMat({ color: HUD_BONE, opacity: 0.045 })));
  hud.add(plate);

  // 360° degree scale just outside the bezel (major every 30°)
  const degScale = hudDegreeScale(1.80, 0.035, 0.085, 120, 10);
  const DEG_VERTS = 120 * 2;
  hud.add(degScale);

  // Counter-rotating partial arcs
  const arcsOuter = new THREE.Group();
  [[0.2, 1.15], [1.6, 0.55], [2.45, 1.6], [4.4, 0.35], [5.0, 0.9]].forEach(([s, l]) =>
    arcsOuter.add(hudArc(1.935, 1.952, s, l, HUD_ORANGE, 0.85)));
  hud.add(arcsOuter);

  const arcsDash = new THREE.Group();
  for (let i = 0; i < 36; i++) {
    if (i % 9 === 8) continue;                       // gaps every quarter
    arcsDash.add(hudArc(1.758, 1.766, i / 36 * Math.PI * 2, 0.09, HUD_BONE, 0.28));
  }
  hud.add(arcsDash);

  // Inner bracket arcs hugging the chamber
  const arcsInner = new THREE.Group();
  [0, Math.PI].forEach(s => arcsInner.add(hudArc(0.66, 0.672, s + 0.35, 1.0, HUD_EMBER, 0.55)));
  hud.add(arcsInner);

  const sweep = hudSweep(1.17, 1.92, 0.9, 32);
  sweep.position.z = A_DEPTH / 2 + 0.01;
  hud.add(sweep);

  scene.add(new THREE.AmbientLight(0x050a12, 2.5));
  const fL = new THREE.PointLight(new THREE.Color(OXIDE), 2.0, 18);
  fL.position.set(2, 3, 4);
  scene.add(fL);
  const bL = new THREE.PointLight(0x5C5C5C, 1.2, 14);
  bL.position.set(-2, -2, 2);
  scene.add(bL);
  const rL = new THREE.DirectionalLight(0xaaddff, 0.25);
  rL.position.set(0, 5, 5);
  scene.add(rL);
  const rimL = new THREE.PointLight(0x1a3050, 1.2, 12);
  rimL.position.set(-3, -1, -2);
  scene.add(rimL);

  const hoverLight = new THREE.PointLight(new THREE.Color(OXIDE), 0, 8);
  scene.add(hoverLight);

  // Hover burst particles
  const PCOUNT = 55;
  const pPos   = new Float32Array(PCOUNT * 3);
  const pVel   = Array.from({ length: PCOUNT }, () => new THREE.Vector3());
  const pLife  = new Float32Array(PCOUNT);

  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

  const pMat = new THREE.PointsMaterial({
    color: new THREE.Color(OXIDE), size: 0.09, map: glowTexture(),
    transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });
  const ps = new THREE.Points(pGeo, pMat);
  scene.add(ps);

  for (let i = 0; i < PCOUNT; i++) { pPos[i*3] = pPos[i*3+1] = pPos[i*3+2] = 999; }

  // Ambient orbital data stream
  const OCOUNT = 64;
  const oPos   = new Float32Array(OCOUNT * 3);
  const oOrbit = Array.from({ length: OCOUNT }, () => ({
    r: 1.62 + Math.random() * 0.34,
    a: Math.random() * Math.PI * 2,
    w: (0.12 + Math.random() * 0.22) * (Math.random() < 0.8 ? 1 : -1),
    z: (Math.random() - 0.5) * 0.18,
  }));
  const oGeo = new THREE.BufferGeometry();
  oGeo.setAttribute('position', new THREE.BufferAttribute(oPos, 3));
  const oMat = new THREE.PointsMaterial({
    color: HUD_EMBER, size: 0.05, map: glowTexture(),
    transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });
  scene.add(new THREE.Points(oGeo, oMat));
  function placeOrbiters() {
    oOrbit.forEach((o, i) => {
      oPos[i*3]   = Math.cos(o.a) * o.r;
      oPos[i*3+1] = Math.sin(o.a) * o.r;
      oPos[i*3+2] = o.z;
    });
    oGeo.attributes.position.needsUpdate = true;
  }
  placeOrbiters();

  function sliceWorldPos(mesh, r) {
    const v = new THREE.Vector3(
      Math.cos(mesh.userData.midAngle) * (r || MID_R),
      Math.sin(mesh.userData.midAngle) * (r || MID_R),
      A_DEPTH / 2,
    );
    mesh.localToWorld(v);
    return v;
  }

  function spawnParticle(i, origin) {
    pPos[i*3]   = origin.x + (Math.random() - 0.5) * 0.28;
    pPos[i*3+1] = origin.y + (Math.random() - 0.5) * 0.28;
    pPos[i*3+2] = origin.z + (Math.random() - 0.5) * 0.12;
    const spd = 0.009 + Math.random() * 0.013;
    const a   = Math.random() * Math.PI * 2;
    pVel[i].set(
      Math.cos(a) * spd * 0.7,
      Math.sin(a) * spd * 0.5 + 0.005,
      (Math.random() - 0.5) * spd * 0.4,
    );
    pLife[i] = 0.5 + Math.random() * 0.5;
  }

  let hoverTarget   = null;
  let particleAlpha = 0;
  let calloutT      = 0;          // 0→1 leader-line reveal
  let calloutMesh   = null;       // last hovered slice, kept so the callout can fade out

  // HUD callout label (positioned at the end of the leader line)
  const callout = document.createElement('div');
  callout.className = 'ring-callout';
  container.appendChild(callout);

  const centerEl = document.createElement('div');
  centerEl.className = 'chart-center';
  centerEl.innerHTML =
    `<div id="${containerId}-cv" style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:18px;letter-spacing:0.04em;color:var(--tan);font-weight:bold;text-shadow:0 0 8px rgba(255,255,255,0.55),0 0 20px rgba(255,255,255,0.28)">${fmt$(totalValue)}</div>` +
    `<div id="${containerId}-cs" style="font-size:10px;letter-spacing:0.14em;color:var(--dim);margin-top:4px;text-transform:uppercase"></div>`;
  container.appendChild(centerEl);
  const centerVal = document.getElementById(containerId + '-cv');
  const centerSub = document.getElementById(containerId + '-cs');
  let prevHoverKey = null;

  if (!REDUCED && totalValue > 0) {
    const dur = 1500, t0 = performance.now() + 350;
    centerVal.textContent = fmt$(0);
    (function tick(now) {
      const p = clamp01((now - t0) / dur);
      const e = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
      if (prevHoverKey === null) centerVal.textContent = fmt$(Math.round(totalValue * e));
      if (p < 1) requestAnimationFrame(tick);
      else if (prevHoverKey === null) centerVal.textContent = fmt$(totalValue);
    })(performance.now());
  }

  const ray   = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const parallax = { x: 0, y: 0, tx: 0, ty: 0 };

  renderer.domElement.addEventListener('mousemove', e => {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
    mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
    parallax.tx = mouse.x; parallax.ty = mouse.y;
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObjects(meshesA, false);
    hoverTarget = hits.length ? hits[0].object : null;
  });
  renderer.domElement.addEventListener('mouseleave', () => {
    hoverTarget = null;
    parallax.tx = parallax.ty = 0;
  });

  let onScreen = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => { onScreen = es[0].isIntersecting; }).observe(container);
  }

  // Leader line: anchor on the slice → 45° elbow → horizontal run to the label
  const _proj = new THREE.Vector3();
  function toScreen(v) {
    _proj.copy(v).project(camera);
    return { x: (_proj.x + 1) / 2 * W, y: (1 - _proj.y) / 2 * H };
  }
  let overlayDirty = false;
  function drawCallout(mesh, t) {
    if (overlayDirty) { octx.clearRect(0, 0, W, H); overlayDirty = false; }
    if (!mesh || t < 0.01) { callout.style.opacity = '0'; return; }
    overlayDirty = true;
    const a  = toScreen(sliceWorldPos(mesh, A_OUT + 0.02));
    const c  = toScreen(new THREE.Vector3(0, 0, 0));
    const dx = a.x - c.x, dy = a.y - c.y;
    const side = dx >= 0 ? 1 : -1;
    const up   = dy <= 0 ? -1 : 1;
    const ELB = 22, RUN = 30;
    const e  = { x: a.x + side * ELB, y: a.y + up * ELB };
    const f  = { x: e.x + side * RUN, y: e.y };

    // Reveal along the polyline
    const seg1 = ELB * Math.SQRT2, seg2 = RUN, L = seg1 + seg2;
    const d    = easeOutCubic(t) * L;
    octx.save();
    octx.strokeStyle = 'rgba(230,225,220,0.75)';
    octx.lineWidth   = 1;
    octx.shadowColor = 'rgba(160,56,40,0.9)';
    octx.shadowBlur  = 6;
    octx.beginPath();
    octx.moveTo(a.x, a.y);
    if (d <= seg1) {
      const k = d / seg1;
      octx.lineTo(a.x + (e.x - a.x) * k, a.y + (e.y - a.y) * k);
    } else {
      octx.lineTo(e.x, e.y);
      octx.lineTo(e.x + (f.x - e.x) * ((d - seg1) / seg2), e.y);
    }
    octx.stroke();
    octx.restore();
    // Anchor reticle
    cvGlow(octx, a.x, a.y, 9, '160,56,40', 0.55 * t);
    cvRing(octx, a.x, a.y, 4.5, `rgba(230,225,220,${0.8 * t})`);
    cvDot(octx, a.x, a.y, 1.6, '#e6e1dc');

    const labelVis = clamp01((t - 0.55) / 0.45);
    callout.style.opacity = String(labelVis);
    callout.style.left    = (side > 0 ? f.x + 4 : f.x - 4) + 'px';
    callout.style.top     = f.y + 'px';
    callout.style.transform = `translate(${side > 0 ? '0' : '-100%'}, -50%)`;
  }

  // Boot timeline (seconds from first frame)
  const BOOT_END = 2.0;
  let bootDone = REDUCED;
  if (!REDUCED) {
    bezel.scale.setScalar(1.25); bezMat.opacity = 0;
    groupB.scale.setScalar(0.001);
    groupC.scale.setScalar(0.001);
    coreGroup.scale.setScalar(0.001);
    meshesA.forEach(m => { m.visible = false; });
    degScale.geometry.setDrawRange(0, 0);
    [arcsOuter, arcsDash, arcsInner, plate, sweep].forEach(g => { g.visible = false; });
  }
  function bootStep(t) {
    const pBez = easeOutCubic(clamp01(t / 0.6));
    bezel.scale.setScalar(1.25 - 0.25 * pBez);
    bezMat.opacity = pBez;

    degScale.geometry.setDrawRange(0, Math.floor(clamp01((t - 0.1) / 0.8) * DEG_VERTS / 2) * 2);
    plate.visible     = t > 0.2;
    arcsDash.visible  = t > 0.45;
    arcsOuter.visible = t > 0.6;
    arcsOuter.rotation.z = (1 - easeOutCubic(clamp01((t - 0.6) / 0.8))) * -2.4;

    groupB.scale.setScalar(Math.max(0.001, easeOutBack(clamp01((t - 0.25) / 0.6))));

    meshesA.forEach(m => {
      const st = 0.55 + m.userData.bootStart * 0.6;
      const p  = clamp01((t - st) / 0.35);
      m.visible = p > 0;
      const sc = Math.max(0.001, easeOutBack(p));
      m.scale.x = m.scale.y = sc;
      m.userData.bootFlash = p > 0 ? Math.max(0, 1 - (t - st - 0.2) / 0.5) * 2.4 : 0;
    });

    groupC.scale.setScalar(Math.max(0.001, easeOutBack(clamp01((t - 0.9) / 0.5))));
    coreGroup.scale.setScalar(Math.max(0.001, easeOutBack(clamp01((t - 1.15) / 0.4))));
    arcsInner.visible = t > 1.2;
    sweep.visible     = t > 1.35;

    // Core ignition flare
    const fl = t > 1.2 && t < 1.9 ? Math.sin(Math.PI * (t - 1.2) / 0.7) : 0;
    return fl;
  }

  // Bootstrap via rAF so `now` is a real timestamp on the first frame —
  // invoking loop() directly seeds clock with NaN (clock += undefined*0.001).
  let clock = 0, lastTs = 0, started = false;
  requestAnimationFrame(function loop(now) {
    requestAnimationFrame(loop);
    if (!started) { lastTs = now; started = true; }
    const dt = Math.min((now - lastTs) * 0.001, 0.05);
    lastTs = now;
    if (!onScreen || document.hidden) return;
    clock += dt;

    let flare = 0;
    if (!bootDone) {
      flare = bootStep(clock);
      if (clock > BOOT_END) {
        bootDone = true;
        meshesA.forEach(m => { m.visible = true; m.scale.x = m.scale.y = 1; m.userData.bootFlash = 0; });
      }
    }

    if (!REDUCED) {
      groupB.rotation.y -= 0.002;
      groupC.rotation.y += 0.009;
      scene.rotation.z   = Math.sin(clock * 0.25) * 0.02;
      if (bootDone || clock > 1.4) arcsOuter.rotation.z += 0.0035;
      arcsDash.rotation.z  -= 0.006;
      arcsInner.rotation.z += 0.012;
      degScale.rotation.z  -= 0.0006;
      gyros.forEach((g, i) => { g.rotation.x += 0.011 * (i + 1); g.rotation.y += 0.007 * (2 - i); });
      oOrbit.forEach(o => { o.a += o.w * dt; });
      placeOrbiters();

      // Mouse parallax
      parallax.x += (parallax.tx - parallax.x) * 0.05;
      parallax.y += (parallax.ty - parallax.y) * 0.05;
      camera.position.set(CAM_BASE.x + parallax.x * 0.45, CAM_BASE.y + parallax.y * 0.3, CAM_BASE.z);
      camera.lookAt(0, 0, 0);
    }

    // Radar sweep
    const sweepAng = REDUCED ? 0.6 : (clock * 0.85) % (Math.PI * 2);
    sweep.rotation.z = sweepAng;

    // Ring A: per-slice emissive + radial pop + depth lift on hover, flash as the sweep passes
    meshesA.forEach(m => {
      const on = m === hoverTarget;
      const ud = m.userData;
      const within = sweepAng >= ud.startAngle && sweepAng <= ud.endAngle;
      const past   = ((sweepAng - ud.endAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      const sweepBoost = REDUCED ? 0 : within ? 0.55 : past < 0.7 ? 0.55 * (1 - past / 0.7) : 0;
      const target = (on ? 2.6 : 1.3) + sweepBoost + (ud.bootFlash || 0);
      m.material.emissiveIntensity += (target - m.material.emissiveIntensity) * 0.15;
      m.position.x += ((on ? Math.cos(ud.midAngle) * 0.1 : 0) - m.position.x) * 0.12;
      m.position.y += ((on ? Math.sin(ud.midAngle) * 0.1 : 0) - m.position.y) * 0.12;
      m.scale.z    += ((on ? 1.18 : 1) - m.scale.z) * 0.12;
      const em = ud.edges.material;
      em.opacity += ((on ? 0.85 : 0) - em.opacity) * 0.15;
    });

    // Core pulse (inner brightens on inverse phase for depth)
    const pulse = 0.5 + 0.5 * Math.sin(clock * 2.5);
    coreMat.emissiveIntensity = 0.6 + 0.4 * pulse + flare * 1.5;
    coreHaloMat.opacity       = 0.22 + 0.16 * pulse + flare * 0.55;
    const haloScale           = 1.1 + 0.18 * pulse + flare * 1.6;
    coreHalo.scale.set(haloScale, haloScale, 1);
    coreInnerMesh.material.emissiveIntensity = 1.4 + 0.6 * (1 - pulse);

    // Cache world pos once per frame
    const wp = hoverTarget ? sliceWorldPos(hoverTarget) : null;

    // Center overlay + particle color + callout text — update only when hover target changes
    const hoverKey = hoverTarget ? hoverTarget.userData.label : null;
    if (hoverKey !== prevHoverKey) {
      prevHoverKey = hoverKey;
      if (hoverTarget) {
        const ud  = hoverTarget.userData;
        const pct = (ud.value / total * 100).toFixed(1);
        centerVal.textContent = fmt$(ud.value);
        centerSub.textContent = ud.label;
        centerSub.style.color = ud.hexColor;
        pMat.color.set(ud.hexColor);
        callout.innerHTML =
          `<div class="rc-name" style="color:${ud.hexColor}">${escapeHTML(ud.label)}</div>` +
          `<div class="rc-val">${fmt$(ud.value)}</div>` +
          `<div class="rc-pct">${pct}% <span>ALLOC</span></div>`;
        calloutT = 0;
      } else {
        centerVal.textContent = fmt$(totalValue);
        centerSub.textContent = '';
        pMat.color.set(OXIDE);
      }
    }

    calloutT += ((hoverTarget ? 1 : 0) - calloutT) * (hoverTarget ? 0.09 : 0.25);
    if (REDUCED && hoverTarget) calloutT = 1;
    if (hoverTarget) calloutMesh = hoverTarget;
    drawCallout(calloutMesh, calloutT);

    if (wp) {
      const lv = wp.clone();
      lv.z += 0.5;
      hoverLight.position.lerp(lv, 0.15);
      hoverLight.color.set(hoverTarget.userData.hexColor);
      hoverLight.intensity += (2.0 - hoverLight.intensity) * 0.12;
    } else {
      hoverLight.intensity += (0 - hoverLight.intensity) * 0.12;
    }

    particleAlpha += ((hoverTarget ? 1 : 0) - particleAlpha) * 0.1;
    pMat.opacity   = particleAlpha * 0.88;
    oMat.opacity   = 0.55 * (1 - particleAlpha * 0.6) * (bootDone ? 1 : clamp01((clock - 0.8) / 0.8));
    const origin   = wp;
    for (let i = 0; i < PCOUNT; i++) {
      pLife[i] -= 0.016;
      if (pLife[i] <= 0) {
        if (origin) spawnParticle(i, origin);
        else { pPos[i*3] = pPos[i*3+1] = pPos[i*3+2] = 999; }
      } else {
        pPos[i*3]   += pVel[i].x;
        pPos[i*3+1] += pVel[i].y;
        pPos[i*3+2] += pVel[i].z;
        pVel[i].multiplyScalar(0.97);
      }
    }
    pGeo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  });
  return meshesA;
}

function renderProgressBar(containerId, current, goal, type) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!goal) {
    el.innerHTML = `<p class="goal-hint">No goal set &mdash; run:&nbsp;<span style="color:var(--text)">portfolio goal set ${type} AMOUNT</span></p>`;
    return;
  }
  const pct    = Math.min(current / goal * 100, 100);
  const pctStr = pct.toFixed(1) + '%';
  const toGo   = Math.max(goal - current, 0);
  el.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-meta">
        <span class="lbl">GOAL PROGRESS</span>
        <span class="pct">${pctStr}</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill${pct >= 3 ? ' has-cap' : ''}" style="--pct:${pctStr}"></div>
      </div>
      <div class="progress-foot">
        <span>${fmt$(current)}</span>
        <span>${fmt$(toGo)} to go&nbsp;·&nbsp;Goal&nbsp;${fmt$(goal)}</span>
      </div>
    </div>`;

  // Percent counter synced to the fill-bar animation (1.6s after a 0.5s delay)
  const pctEl = el.querySelector('.pct');
  if (!REDUCED) {
    const dur = 1600, delay = 500, t0 = performance.now();
    pctEl.textContent = '0.0%';
    (function tick(now) {
      const p = Math.max(0, Math.min((now - t0 - delay) / dur, 1));
      const e = 1 - Math.pow(1 - p, 3);
      pctEl.textContent = (pct * e).toFixed(1) + '%';
      if (p < 1) requestAnimationFrame(tick);
      else pctEl.textContent = pctStr;
    })(t0);
  }
}

// Label color palette (user-selectable, 1–11)
const LABEL_COLORS = [
  '#d8d0c8', // 1 Bone White
  '#a03828', // 2 Oxide Red
  '#8b4a3a', // 3 Muted Burgundy
  '#324155', // 4 Cold Blue Steel
  '#3c2d46', // 5 Dusty Purple
  '#0f2d23', // 6 Deep Forest
  '#660000', // 7 Crimson Red
  '#4a3220', // 8 Coffee Brown
  '#ff69b4', // 9 Bright Pink
  '#39d353', // 10 Bright Green
  '#454545', // 11 Smoke Grey
];
function swatchesHtml(activeColor) {
  return `<div class="color-picker">${LABEL_COLORS.map(c =>
    `<button class="color-swatch${c === activeColor ? ' active' : ''}" data-color="${c}" style="background:${c}"></button>`
  ).join('')}</div>`;
}

function renderHoldings() {
  const el       = document.getElementById('holdings-list');
  const holdings = D.holdings || [];
  if (!holdings.length) {
    el.innerHTML = `<div class="data-row"><span class="dr-mid">No holdings yet.</span></div>`;
    return;
  }
  el.innerHTML = holdings.map((h, i) => {
    const CORP = /\s+(Company|Corporation|Corp\.?|Inc\.?|Ltd\.?|LLC|L\.L\.C\.|PLC|N\.A\.|Incorporated|Limited)$/i;
    const shortLabel = h.label ? h.label.replace(CORP, '').trim() : '';
    const color      = localStorage.getItem('color_h_' + h.ticker) || SLICE_COLORS[i % SLICE_COLORS.length];

    // Quote failed upstream — show the position without pretending it's worth $0
    if (h.value == null) {
      return `
      <div class="data-row" data-key="h_${h.ticker}">
        <span class="dr-left" style="color:${color}">${escapeHTML(h.ticker)}<span class="dr-sub">quote unavailable</span></span>
        ${swatchesHtml(color)}
        <span class="dr-mid">${escapeHTML(shortLabel)}</span>
        <span class="dr-right">—<span class="dr-sub">basis ${fmt$(h.cost)}</span></span>
      </div>`;
    }

    const gainCls    = h.gain_dollar > 0 ? 'pos' : h.gain_dollar < 0 ? 'neg' : '';
    const gainArrow  = h.gain_dollar > 0 ? '▲'  : h.gain_dollar < 0 ? '▼'  : '—';
    const dayCls     = h.day_change_pct > 0 ? 'hm-pos' : h.day_change_pct < 0 ? 'hm-neg' : 'hm-val';
    const gainHmCls  = h.gain_dollar > 0    ? 'hm-pos' : h.gain_dollar < 0    ? 'hm-neg' : 'hm-val';

    // Cost→gain proportion bar: gray = basis, tan = gain (or --neg = loss, scaled to basis)
    let barHtml = '';
    if (h.cost > 0 && h.value > 0) {
      const barTitle = `basis ${fmt$(h.cost)} → ${fmt$(h.value)} (${fmtGain$(h.gain_dollar)})`;
      if (h.gain_dollar >= 0) {
        const costW = Math.min(h.cost / h.value * 100, 100);
        barHtml = `<span class="hm-bar" title="${barTitle}"><span class="hm-bar-cost" style="width:${costW.toFixed(1)}%"></span><span class="hm-bar-gain" style="width:${(100 - costW).toFixed(1)}%"></span></span>`;
      } else {
        const valW = Math.min(h.value / h.cost * 100, 100);
        barHtml = `<span class="hm-bar" title="${barTitle}"><span class="hm-bar-cost" style="width:${valW.toFixed(1)}%"></span><span class="hm-bar-loss" style="width:${(100 - valW).toFixed(1)}%"></span></span>`;
      }
    }

    return `
      <div class="data-row" data-key="h_${h.ticker}" style="border-bottom:none;padding-bottom:6px">

// Ported from the Vedra Research portfolio site (drawEquity scene), recolored to
// the dashboard's rust palette. Self-contained so it can't collide with the 3D loops.
(function(){
  var cv = document.getElementById('header-viz');
  if (!cv) return;
  var ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  var GOLD = '160,56,40', GREY = '146,140,132', BONE = '#e6e1dc', BONE_RGB = '230,225,220';

  function grid(ctx,W,H){
    ctx.strokeStyle='rgba(40,40,40,0.85)'; ctx.lineWidth=1;
    for(var x=0;x<=W;x+=W/8){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(var y=0;y<=H;y+=H/8){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }
  function fPort(x){return 0.5+0.18*Math.sin(x*0.15)+0.10*Math.sin(x*0.37+1.3)+0.06*Math.sin(x*0.8+2.1);}
  function fBench(x){return 0.5+0.12*Math.sin(x*0.13+0.5)+0.05*Math.sin(x*0.3+0.7);}
  function drawEquity(ctx,W,H,t){
    grid(ctx,W,H);
    var topY=H*0.16,botY=H*0.84;
    function mapY(v){return botY-v*(botY-topY);}
    var span=44, scroll=t*1.5, step=Math.max(3,W/64);
    ctx.setLineDash([4,4]);ctx.beginPath();
    for(var px=0;px<=W;px+=step){var u=px/W,s=u*span+scroll,y=mapY(fBench(s));if(px===0)ctx.moveTo(px,y);else ctx.lineTo(px,y);}
    ctx.strokeStyle='rgba('+GREY+',0.40)';ctx.lineWidth=1.1;ctx.stroke();ctx.setLineDash([]);
    var path=[];
    for(var p2=0;p2<=W;p2+=step){var u2=p2/W,s2=u2*span+scroll;path.push({x:p2,y:mapY(fPort(s2))});}
    var grad=ctx.createLinearGradient(0,topY,0,botY);
    grad.addColorStop(0,'rgba('+GOLD+',0.32)');grad.addColorStop(1,'rgba('+GOLD+',0)');
    ctx.beginPath();ctx.moveTo(path[0].x,botY);
    for(var i=0;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);
    ctx.lineTo(path[path.length-1].x,botY);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();for(var j=0;j<path.length;j++){if(j===0)ctx.moveTo(path[j].x,path[j].y);else ctx.lineTo(path[j].x,path[j].y);}
    ctx.strokeStyle='rgba('+GOLD+',0.18)';ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();
    ctx.beginPath();for(var k=0;k<path.length;k++){if(k===0)ctx.moveTo(path[k].x,path[k].y);else ctx.lineTo(path[k].x,path[k].y);}
    ctx.strokeStyle='rgba('+GOLD+',0.92)';ctx.lineWidth=1.8;ctx.stroke();
    var mx=W*0.88, my=mapY(fPort((mx/W)*span+scroll));
    cvGlow(ctx,mx,my,10,GOLD,0.5);cvRing(ctx,mx,my,6,'rgba('+BONE_RGB+',0.35)'); cvDot(ctx,mx,my,2.8,BONE);
  }

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    ctx.clearRect(0,0,W,H); drawEquity(ctx,W,H,-0.9); return;
  }
  var t=0;
  (function loop(){
    t+=0.011;
    ctx.clearRect(0,0,W,H); drawEquity(ctx,W,H,t);
    requestAnimationFrame(loop);
  })();
})();

const WL_W = 220, WL_H = 48;

/* One shared rAF loop drives the ambient chart effects (end-dot pings, the analysis
   scan beam). Canvases that are detached, offscreen, or mid draw-in are skipped. */
const _sparkLive = new Map();   // canvas -> tick(now)
let   _sparkLoopOn = false, _sparkSeq = 0;
const _sparkIO = 'IntersectionObserver' in window
  ? new IntersectionObserver(es => es.forEach(e => { e.target._onScreen = e.isIntersecting; }))
  : null;

function _sparkRegister(canvas, tick) {
  if (REDUCED) return;
  if (!_sparkLive.has(canvas) && _sparkIO) _sparkIO.observe(canvas);
  _sparkLive.set(canvas, tick);
  if (!_sparkLoopOn) { _sparkLoopOn = true; requestAnimationFrame(_sparkLoop); }
}
function _sparkLoop(now) {
  requestAnimationFrame(_sparkLoop);
  if (document.hidden) return;
  _sparkLive.forEach((tick, c) => {
    if (!c.isConnected) { _sparkLive.delete(c); if (_sparkIO) _sparkIO.unobserve(c); return; }
    if (c._onScreen === false) return;
    tick(now);
  });
}

function drawSparkline(canvas, prices, w, h, opts = {}) {
  // Bumping the generation cancels any draw-in still running on this canvas
  const gen = canvas._sparkGen = (canvas._sparkGen || 0) + 1;
  _sparkLive.delete(canvas);

  const W   = w || WL_W, H = h || WL_H;
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (!prices || prices.length < 2) {
    ctx.strokeStyle = 'rgba(104,104,104,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    return null;
  }

  const muted = !!opts.muted;
  const hud   = !!opts.grid;
  const n     = prices.length, PAD = 5;
  const PAD_R = muted ? 4 : 6;               // room for the end-dot
  const min = Math.min(...prices), max = Math.max(...prices), rng = max - min || 1;
  const xp  = i => (i / (n - 1)) * (W - PAD_R);
  const yp  = v => H - PAD - ((v - min) / rng) * (H - PAD * 2);
  const up  = prices[n - 1] >= prices[0];
  const GLOW_RGB = up ? '160,56,40' : '182,85,72';

  function makeGrads() {
    const lg = ctx.createLinearGradient(0, 0, W, 0);
    if (up) {
      lg.addColorStop(0,    '#d8d0c8');
      lg.addColorStop(0.45, '#787878');
      lg.addColorStop(1,    OXIDE);
    } else {
      lg.addColorStop(0,    '#b65548');
      lg.addColorStop(0.45, '#8b4a3a');
      lg.addColorStop(1,    OXIDE);
    }
    const fg = ctx.createLinearGradient(0, 0, 0, H);
    fg.addColorStop(0, up ? 'rgba(76,7,1,0.30)' : 'rgba(182,85,72,0.22)');
    fg.addColorStop(1, up ? 'rgba(76,7,1,0)'    : 'rgba(182,85,72,0)');
    return { lg, fg };
  }

  // Midpoint-quadratic smoothing: corner rounding only, never overshoots the data.
  // `head` extends the path to an interpolated point during the draw-in.
  function tracePath(count, head) {
    ctx.moveTo(xp(0), yp(prices[0]));
    for (let i = 1; i < count - 1; i++) {
      const mx = (xp(i) + xp(i + 1)) / 2;
      const my = (yp(prices[i]) + yp(prices[i + 1])) / 2;
      ctx.quadraticCurveTo(xp(i), yp(prices[i]), mx, my);
    }
    ctx.lineTo(xp(count - 1), yp(prices[count - 1]));
    if (head) ctx.lineTo(head.x, head.y);
  }

  function seg(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }

  // Analysis-chart HUD: minor grid, bottom ruler, corner brackets
  function drawHudFrame() {
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(146,140,132,0.06)';
    for (let k = 1; k < 12; k++) { const x = Math.round(W * k / 12) + 0.5; seg(x, 0, x, H); }
    for (let k = 1; k < 4; k++)  { const y = Math.round(H * k / 4) + 0.5;  seg(0, y, W, y); }
    ctx.strokeStyle = 'rgba(146,140,132,0.30)';
    for (let k = 0; k <= 48; k++) {
      const x = Math.round((W - 1) * k / 48) + 0.5;
      seg(x, H, x, H - (k % 4 === 0 ? 5 : 2));
    }
    ctx.strokeStyle = 'rgba(160,56,40,0.85)'; ctx.lineWidth = 1.2;
    const B = 11;
    [[0.5, 0.5, 1, 1], [W - 0.5, 0.5, -1, 1], [0.5, H - 0.5, 1, -1], [W - 0.5, H - 0.5, -1, -1]].forEach(([x, y, sx, sy]) => {
      ctx.beginPath(); ctx.moveTo(x, y + sy * B); ctx.lineTo(x, y); ctx.lineTo(x + sx * B, y); ctx.stroke();
    });
    ctx.restore();
  }

  function drawStatic(count, head) {
    const { lg, fg } = makeGrads();
    const c = head ? Math.max(1, count) : Math.max(2, count || n);
    ctx.clearRect(0, 0, W, H);

    if (hud) drawHudFrame();

    // Min/mid/max gridlines with price labels (analysis chart only)
    if (opts.grid) {
      ctx.font = '10px "Courier New", monospace';
      ctx.textAlign = 'right';
      [max, (min + max) / 2, min].forEach(v => {
        const y = Math.round(yp(v)) + 0.5;
        ctx.strokeStyle = 'rgba(146,140,132,0.14)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        ctx.fillStyle = 'rgba(146,140,132,0.55)';
        ctx.fillText('$' + v.toFixed(2), W - 4, v === max ? y + 11 : y - 4);
      });
    }

    // Dashed baseline at the period open
    if (!muted) {
      const by = Math.round(yp(prices[0])) + 0.5;
      ctx.save();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = 'rgba(146,140,132,0.30)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, by); ctx.lineTo(W, by); ctx.stroke();
      ctx.restore();
    }

    const endX = head ? head.x : xp(c - 1);
    ctx.beginPath();
    tracePath(c, head);
    ctx.lineTo(endX, H); ctx.lineTo(xp(0), H); ctx.closePath();
    ctx.fillStyle = fg; ctx.fill();

    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    // Holographic stroke: wide halo → core line → hairline highlight
    ctx.beginPath(); tracePath(c, head);
    ctx.strokeStyle = `rgba(${GLOW_RGB},${muted ? 0.14 : 0.20})`;
    ctx.lineWidth   = muted ? 3.5 : 6;
    ctx.stroke();

    ctx.save();
    ctx.shadowBlur = muted ? 3 : 8;
    ctx.shadowColor = up ? 'rgba(76,7,1,0.85)' : 'rgba(182,85,72,0.6)';
    ctx.beginPath(); tracePath(c, head);
    ctx.strokeStyle = lg; ctx.lineWidth = muted ? 1.4 : 1.8;
    ctx.stroke(); ctx.restore();

    if (!muted) {
      ctx.beginPath(); tracePath(c, head);
      ctx.strokeStyle = 'rgba(255,244,236,0.30)'; ctx.lineWidth = 0.6;
      ctx.stroke();
    }

    // End-dot marker on the latest price, once fully revealed
    if (c === n && !head) {
      const ex = xp(n - 1), ey = yp(prices[n - 1]);
      if (muted) {
        cvDot(ctx, ex, ey, 1.8, '#e6e1dc');
      } else {
        cvGlow(ctx, ex, ey, 8, '230,225,220', 0.4);
        cvRing(ctx, ex, ey, 4.5, 'rgba(10,10,10,0.9)');
        cvDot(ctx, ex, ey, 2.5, '#e6e1dc');
      }
    }
  }

  // Scan head: glowing write-point with a vertical beam and a short trailing wash
  function drawHead(hx, hy) {
    if (muted) {
      cvGlow(ctx, hx, hy, 5, '230,225,220', 0.6);
      cvDot(ctx, hx, hy, 1.4, '#ffffff');
      return;
    }
    const tw = ctx.createLinearGradient(hx - 34, 0, hx, 0);
    tw.addColorStop(0, `rgba(${GLOW_RGB},0)`);
    tw.addColorStop(1, `rgba(${GLOW_RGB},0.16)`);
    ctx.fillStyle = tw; ctx.fillRect(hx - 34, 0, 34, H);
    const bm = ctx.createLinearGradient(0, 0, 0, H);
    bm.addColorStop(0, 'rgba(230,225,220,0)');
    bm.addColorStop(Math.min(Math.max(hy / H, 0.05), 0.95), 'rgba(230,225,220,0.55)');
    bm.addColorStop(1, 'rgba(230,225,220,0)');
    ctx.fillStyle = bm; ctx.fillRect(hx - 0.5, 0, 1, H);
    cvGlow(ctx, hx, hy, 11, '230,225,220', 0.55);
    cvGlow(ctx, hx, hy, 18, GLOW_RGB, 0.35);
    cvDot(ctx, hx, hy, 2.2, '#ffffff');
  }

  // Ambient effects once the line is drawn: periodic end-dot ping, plus a slow
  // left→right scan beam on the analysis chart. Staggered so rows ping in a wave.
  const ex = xp(n - 1), ey = yp(prices[n - 1]);
  const pingOffset = (_sparkSeq++ % 12) * 280;
  const PING_PERIOD = muted ? 5600 : 4400, PING_DUR = 1200;
  const SCAN_PERIOD = 7500, SCAN_DUR = 2400;
  let tBase = 0, wasActive = false;

  function pathYAt(x) {
    const fi = Math.max(0, Math.min(n - 1, x / (W - PAD_R) * (n - 1)));
    const i0 = Math.floor(fi), i1 = Math.min(n - 1, i0 + 1), fr = fi - i0;
    return yp(prices[i0] + (prices[i1] - prices[i0]) * fr);
  }

  function ambientTick(now) {
    if (canvas._sparkGen !== gen) return;
    const lt    = now - tBase;
    const pLocal = (lt + pingOffset) % PING_PERIOD;
    const ping  = pLocal < PING_DUR;
    const sLocal = lt % SCAN_PERIOD;
    const scan  = hud && sLocal < SCAN_DUR;
    if (!ping && !scan && !wasActive) return;
    wasActive = ping || scan;
    drawStatic(n);
    if (scan) {
      const sp = sLocal / SCAN_DUR;
      const sx = (sp * 1.1 - 0.05) * W;
      const band = ctx.createLinearGradient(sx - 60, 0, sx, 0);
      band.addColorStop(0, 'rgba(160,56,40,0)');
      band.addColorStop(1, 'rgba(160,56,40,0.10)');
      ctx.fillStyle = band; ctx.fillRect(sx - 60, 0, 60, H);
      ctx.fillStyle = 'rgba(230,225,220,0.30)'; ctx.fillRect(sx - 0.5, 0, 1, H);
      if (sx >= 0 && sx <= ex) {
        const sy = pathYAt(sx);
        cvGlow(ctx, sx, sy, 10, '230,225,220', 0.45);
        cvDot(ctx, sx, sy, 1.8, '#ffffff');
      }
    }
    if (ping) {
      const p = pLocal / PING_DUR;
      [0, 0.28].forEach(d => {
        const q = (p - d) / (1 - d);
        if (q <= 0 || q >= 1) return;
        ctx.beginPath();
        ctx.arc(ex, ey, (muted ? 2 : 3) + q * (muted ? 7 : 15), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(230,225,220,${(1 - q) * (muted ? 0.35 : 0.6)})`;
        ctx.lineWidth = 1; ctx.stroke();
      });
    }
  }

  const mappers = { xp, yp, n, up };
  const animate = opts.animate !== false && !REDUCED;
  if (!animate) {
    drawStatic(n);
    tBase = performance.now();
    _sparkRegister(canvas, ambientTick);
    return mappers;
  }

  const t0 = performance.now(), dur = muted ? 750 : hud ? 1400 : 1000;
  function drawFrame(now) {
    if (canvas._sparkGen !== gen) return;
    // rAF timestamps can precede t0 (frame start < call time), so clamp the low end too
    const t = clamp01((now - t0) / dur);
    const f = (1 - Math.pow(1 - t, 3)) * (n - 1);
    const i0 = Math.floor(f);
    if (t >= 1 || i0 >= n - 1) {
      drawStatic(n);
      // Lock-on: the first ping fires as the line lands
      tBase = performance.now() - (PING_PERIOD - pingOffset) % PING_PERIOD;
      _sparkRegister(canvas, ambientTick);
      return;
    }
    const fr = f - i0;
    const head = {
      x: xp(i0) + (xp(i0 + 1) - xp(i0)) * fr,
      y: yp(prices[i0]) + (yp(prices[i0 + 1]) - yp(prices[i0])) * fr,
    };
    drawStatic(i0 + 1, head);
    drawHead(head.x, head.y);
    requestAnimationFrame(drawFrame);
  }
  requestAnimationFrame(drawFrame);
  return mappers;
}
